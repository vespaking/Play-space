<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iron Coach">
  <meta name="theme-color" content="#0a0a0a">
  <title>Iron Coach</title>
  <style>
/* ============================================================
   Iron Coach – Mobile-first PWA styles (iPhone / iOS Safari)
   ============================================================ */

:root {
  --bg: #0a0a0a;
  --bg-card: #161616;
  --bg-card-alt: #1e1e1e;
  --bg-input: #222;
  --text: #f0f0f0;
  --text-dim: #888;
  --text-muted: #555;
  --accent: #f97316;
  --accent-dim: #c2410c;
  --green: #22c55e;
  --green-dim: #166534;
  --red: #ef4444;
  --red-dim: #991b1b;
  --blue: #3b82f6;
  --radius: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-height: 72px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
}

/* ── Tab Bar ────────────────────────────────────── */

#tab-bar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: var(--tab-height);
  padding-bottom: var(--safe-bottom);
  background: #111;
  border-top: 1px solid #222;
  flex-shrink: 0;
  order: 2;
  position: relative;
  z-index: 100;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 8px 16px;
  cursor: pointer;
  transition: color 0.15s;
}

.tab svg {
  width: 26px;
  height: 26px;
}

.tab.active {
  color: var(--accent);
}

/* ── Views ──────────────────────────────────────── */

.view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  order: 1;
}

.view.hidden { display: none; }
.hidden { display: none !important; }

/* ── Workout Idle ───────────────────────────────── */

.idle-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: 40px 24px;
  text-align: center;
  gap: 16px;
}

.idle-content h1 {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: var(--text-dim);
  font-size: 17px;
  margin-bottom: 12px;
}

#todays-workout-preview {
  width: 100%;
  max-width: 340px;
}

.preview-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  text-align: left;
  margin-bottom: 20px;
}

.preview-card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.preview-card .preview-day {
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.preview-card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.preview-card li {
  color: var(--text-dim);
  font-size: 15px;
}

.preview-card li::before {
  content: '•';
  color: var(--accent);
  margin-right: 8px;
}

/* ── Buttons ────────────────────────────────────── */

.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 16px 40px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  min-height: 54px;
  transition: transform 0.1s, opacity 0.1s;
}

.btn-primary:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.btn-xl {
  width: 100%;
  max-width: 340px;
  padding: 18px;
  font-size: 20px;
  min-height: 60px;
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-dim);
  border: 1px solid #333;
  border-radius: var(--radius);
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  max-width: 340px;
}

.btn-finish {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.btn-finish:active { opacity: 0.85; }

/* ── Workout Active ─────────────────────────────── */

#workout-active {
  display: flex;
  flex-direction: column;
  height: 100%;
}

#workout-active.hidden {
  display: none !important;
}

#workout-header {
  padding: 12px 16px 8px;
  flex-shrink: 0;
}

.workout-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.workout-title-row h2 {
  font-size: 20px;
  font-weight: 700;
}

.timer {
  font-size: 14px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  margin-bottom: 8px;
}

#exercise-progress-bar {
  height: 3px;
  background: #222;
  border-radius: 2px;
  overflow: hidden;
}

#exercise-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
  width: 0%;
}

/* ── Exercise Card ──────────────────────────────── */

#exercise-carousel {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px 16px;
}

.exercise-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
}

.exercise-illustration {
  width: 100%;
  height: 140px;
  background: var(--bg-card-alt);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.exercise-illustration svg {
  width: 100%;
  height: 100%;
}

.exercise-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 2px;
}

.exercise-target {
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 14px;
}

/* ── Sets Table ─────────────────────────────────── */

.sets-container {
  margin-top: 4px;
}

.sets-header {
  display: grid;
  grid-template-columns: 40px 1fr 72px 72px 48px;
  gap: 6px;
  padding: 6px 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.set-row {
  display: grid;
  grid-template-columns: 40px 1fr 72px 72px 48px;
  gap: 6px;
  padding: 6px 4px;
  align-items: center;
  border-radius: 8px;
  transition: background 0.15s;
}

.set-row.completed {
  opacity: 0.6;
}

.set-row .col-set {
  font-weight: 700;
  font-size: 15px;
  text-align: center;
}

.set-row .col-prev {
  font-size: 13px;
  color: var(--text-dim);
}

.set-row .col-prev .prev-comparison {
  font-size: 11px;
  font-weight: 600;
  margin-left: 4px;
}

.set-row .col-prev .prev-comparison.ahead { color: var(--green); }
.set-row .col-prev .prev-comparison.behind { color: var(--red); }

.set-input {
  width: 100%;
  background: var(--bg-input);
  border: 2px solid transparent;
  border-radius: 8px;
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  padding: 10px 4px;
  font-family: inherit;
  min-height: 44px;
  -webkit-appearance: none;
  appearance: none;
}

.set-input:focus {
  outline: none;
  border-color: var(--accent);
}

.set-input.changed-up {
  border-color: var(--green);
  background: rgba(34, 197, 94, 0.08);
}

.set-input.changed-down {
  border-color: var(--red);
  background: rgba(239, 68, 68, 0.08);
}

.btn-check {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid #444;
  background: transparent;
  color: #444;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.btn-check.checked {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

.btn-check:active {
  transform: scale(0.9);
}

.btn-add-set {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: transparent;
  border: 1px dashed #444;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

/* ── Exercise Nav ───────────────────────────────── */

#exercise-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 32px;
  padding: 12px 16px;
  flex-shrink: 0;
}

.btn-nav {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-nav:active {
  background: #333;
}

.btn-nav svg {
  width: 24px;
  height: 24px;
}

#exercise-counter {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ── Rest Timer Overlay ─────────────────────────── */

.rest-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rest-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.rest-label {
  font-size: 18px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.rest-time {
  font-size: 72px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.rest-buttons {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

.btn-rest-adj {
  background: var(--bg-card);
  border: 1px solid #333;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  padding: 12px 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  min-height: 48px;
}

.btn-rest-skip {
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  padding: 12px 32px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  min-height: 48px;
}

/* ── Workout Picker Modal ───────────────────────── */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-content {
  background: var(--bg-card);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom));
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  font-size: 22px;
  font-weight: 700;
}

.btn-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 28px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.workout-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.workout-item {
  background: var(--bg-card-alt);
  border: 1px solid #333;
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.workout-item:active {
  border-color: var(--accent);
}

.workout-item h3 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}

.workout-item p {
  font-size: 14px;
  color: var(--text-dim);
}

/* ── Workout Complete Modal ─────────────────────── */

.modal-complete {
  text-align: center;
  border-radius: 20px 20px 0 0;
  padding: 40px 24px;
}

.complete-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 36px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.modal-complete h2 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 16px;
}

#workout-summary {
  text-align: left;
  margin-bottom: 24px;
}

.summary-stat {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #222;
  font-size: 16px;
}

.summary-stat .label { color: var(--text-dim); }
.summary-stat .value { font-weight: 700; }

/* ── Chat / Coach ───────────────────────────────── */

.chat-container {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 85%;
}

.message.user {
  align-self: flex-end;
}

.message.assistant {
  align-self: flex-start;
}

.message-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 16px;
  line-height: 1.45;
}

.message.user .message-bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.message.assistant .message-bubble {
  background: var(--bg-card-alt);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.chat-input-area {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  padding-bottom: calc(12px + var(--safe-bottom));
  background: #111;
  border-top: 1px solid #222;
  flex-shrink: 0;
}

#chat-input {
  flex: 1;
  background: var(--bg-input);
  border: none;
  border-radius: 22px;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  padding: 12px 18px;
  resize: none;
  max-height: 120px;
  -webkit-appearance: none;
}

#chat-input:focus { outline: none; }

.btn-send {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.btn-send svg {
  width: 20px;
  height: 20px;
}

.btn-send:disabled {
  opacity: 0.4;
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-indicator span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: typing 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-3px); }
}

/* ── Progress Tab ───────────────────────────────── */

.progress-container {
  padding: 16px;
  min-height: 100%;
}

.progress-header {
  margin-bottom: 16px;
}

.progress-header h2 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 12px;
}

.progress-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 3px;
}

.ptab {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.ptab.active {
  background: var(--accent);
  color: #fff;
}

.ptab-content.hidden { display: none; }

#exercise-select-wrap {
  margin-bottom: 16px;
}

#exercise-select {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid #333;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 16px;
  padding: 12px 16px;
  font-family: inherit;
  -webkit-appearance: none;
}

#progress-chart {
  width: 100%;
  background: var(--bg-card);
  border-radius: var(--radius);
}

.chart-legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-dim);
}

/* ── Photo Timeline ─────────────────────────────── */

.photo-timeline {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.photo-entry {
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-card);
}

.photo-entry img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  display: block;
}

.photo-entry .photo-date {
  padding: 8px 10px;
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
}

/* ── Workout History ────────────────────────────── */

.history-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
}

.history-item h4 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}

.history-item .history-date {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.history-exercise {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  padding: 4px 0;
}

.history-exercise .name { color: var(--text); }
.history-exercise .detail { color: var(--text-dim); }

/* ── Misc ───────────────────────────────────────── */

/* API key prompt */
.api-key-prompt {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.api-key-form {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
}

.api-key-form h2 { font-size: 22px; font-weight: 700; }
.api-key-form p { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

.api-key-form input {
  background: var(--bg-card);
  border: 1px solid #333;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  padding: 14px 16px;
  font-family: monospace;
  -webkit-appearance: none;
}

.api-key-form input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Toast notifications */
.toast {
  position: fixed;
  top: calc(16px + var(--safe-top));
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid #333;
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  z-index: 400;
  animation: toast-in 0.3s, toast-out 0.3s 2.5s forwards;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toast-out {
  from { opacity: 1; }
  to { opacity: 0; }
}

  </style>
</head>
<body>
  <div id="app">
    <!-- Tab bar at bottom -->
    <nav id="tab-bar">
      <button class="tab active" data-tab="workout" aria-label="Workout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M6.5 6.5v11M17.5 6.5v11M2 9.5v5M22 9.5v5M6.5 12h11M2 12h4.5M17.5 12H22"/>
        </svg>
        <span>Workout</span>
      </button>
      <button class="tab" data-tab="coach" aria-label="Coach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

/* ============================================================
   Iron Coach – IndexedDB Persistence Layer
   Aggressive state saving: survives screen lock, app switch,
   page refresh, and iOS Safari eviction.
   ============================================================ */

const DB_NAME = 'iron-coach';
const DB_VERSION = 1;

const IronDB = (() => {
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // Workout templates / plans
        if (!db.objectStoreNames.contains('workouts')) {
          db.createObjectStore('workouts', { keyPath: 'id' });
        }
        // Completed workout sessions (history)
        if (!db.objectStoreNames.contains('sessions')) {
          const sessions = db.createObjectStore('sessions', { keyPath: 'id' });
          sessions.createIndex('date', 'date');
        }
        // Exercise catalog
        if (!db.objectStoreNames.contains('exercises')) {
          db.createObjectStore('exercises', { keyPath: 'id' });
        }
        // Key-value store for app state, settings, etc.
        if (!db.objectStoreNames.contains('state')) {
          db.createObjectStore('state', { keyPath: 'key' });
        }
        // Progress photos
        if (!db.objectStoreNames.contains('photos')) {
          const photos = db.createObjectStore('photos', { keyPath: 'id' });
          photos.createIndex('date', 'date');
        }
        // Chat messages
        if (!db.objectStoreNames.contains('chat')) {
          db.createObjectStore('chat', { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = (e) => {
        _db = e.target.result;
        resolve(_db);
      };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function tx(store, mode = 'readonly') {
    return open().then((db) => {
      const t = db.transaction(store, mode);
      return t.objectStore(store);
    });
  }

  function put(store, data) {
    return tx(store, 'readwrite').then(
      (s) => new Promise((resolve, reject) => {
        const r = s.put(data);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      })
    );
  }

  function get(store, key) {
    return tx(store).then(
      (s) => new Promise((resolve, reject) => {
        const r = s.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      })
    );
  }

  function getAll(store) {
    return tx(store).then(
      (s) => new Promise((resolve, reject) => {
        const r = s.getAll();
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      })
    );
  }

  function del(store, key) {
    return tx(store, 'readwrite').then(
      (s) => new Promise((resolve, reject) => {
        const r = s.delete(key);
        r.onsuccess = () => resolve();
        r.onerror = () => reject(r.error);
      })
    );
  }

  function getAllByIndex(store, indexName, value) {
    return tx(store).then(
      (s) => new Promise((resolve, reject) => {
        const idx = s.index(indexName);
        const r = idx.getAll(value);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      })
    );
  }

  function clear(store) {
    return tx(store, 'readwrite').then(
      (s) => new Promise((resolve, reject) => {
        const r = s.clear();
        r.onsuccess = () => resolve();
        r.onerror = () => reject(r.error);
      })
    );
  }

  // ── State helpers (key-value) ──────────────────

  function setState(key, value) {
    return put('state', { key, value, ts: Date.now() });
  }

  function getState(key) {
    return get('state', key).then((r) => r ? r.value : null);
  }

  // ── Aggressive localStorage mirror ─────────────
  // IndexedDB can be slow to read on cold start. We mirror
  // critical state to localStorage for instant hydration.

  function mirrorSet(key, value) {
    try {
      localStorage.setItem('ic_' + key, JSON.stringify(value));
    } catch (e) { /* quota exceeded, ignore */ }
    return setState(key, value);
  }

  function mirrorGet(key) {
    try {
      const raw = localStorage.getItem('ic_' + key);
      if (raw !== null) return JSON.parse(raw);
    } catch (e) { /* parse error */ }
    return null;
  }

  return {
    open, put, get, getAll, del, getAllByIndex, clear,
    setState, getState, mirrorSet, mirrorGet
  };
})();

let state = {
  activeTab: 'workout',
  // Active workout session
  activeWorkout: null,    // { workoutId, name, startTime, exerciseIndex, exercises: [{ ...def, sets: [{ weight, reps, done }] }] }
  workoutTimerStart: null,
  // Rest timer
  restTimer: null,        // { remaining, total }
  // Coach chat
  chatMessages: [],
  apiKey: null,
};

let timerInterval = null;
let restInterval = null;

// ── Init ────────────────────────────────────────

async function init() {
  await IronDB.open();
  await seedDefaultWorkouts();
  await restoreState();
  bindEvents();
  registerSW();
  renderCurrentView();

  // Aggressive state saving on visibility change (screen lock / app switch)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      saveState();
    } else {
      // Re-entering: resync timers
      restoreTimers();
    }
  });

  // Save on pagehide (iOS Safari fires this on tab close / navigate away)
  window.addEventListener('pagehide', () => saveState());

  // Periodic save every 5s during active workout
  setInterval(() => {
    if (state.activeWorkout) saveState();
  }, 5000);
}

async function registerSW() {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/sw.js');
    } catch (e) {
      console.warn('SW registration failed:', e);
    }
  }
}

async function seedDefaultWorkouts() {
  const existing = await IronDB.getAll('workouts');
  if (existing.length === 0) {
    for (const w of DEFAULT_WORKOUTS) {
      await IronDB.put('workouts', w);
    }
  }
}

// ── State Persistence ───────────────────────────

function saveState() {
  const snapshot = {
    activeTab: state.activeTab,
    activeWorkout: state.activeWorkout,
    workoutTimerStart: state.workoutTimerStart,
    restTimer: state.restTimer ? {
      remaining: state.restTimer.remaining,
      total: state.restTimer.total,
      pausedAt: Date.now()
    } : null,
  };
  IronDB.mirrorSet('appState', snapshot);
}

async function restoreState() {
  // Try fast localStorage first, fall back to IndexedDB
  let snapshot = IronDB.mirrorGet('appState');
  if (!snapshot) {
    snapshot = await IronDB.getState('appState');
  }
  if (snapshot) {
    state.activeTab = snapshot.activeTab || 'workout';
    state.activeWorkout = snapshot.activeWorkout || null;
    state.workoutTimerStart = snapshot.workoutTimerStart || null;
    state.restTimer = snapshot.restTimer || null;
  }

  // Restore API key
  state.apiKey = IronDB.mirrorGet('apiKey') || await IronDB.getState('apiKey');

  // Restore chat messages
  const msgs = await IronDB.getAll('chat');
  state.chatMessages = msgs.sort((a, b) => (a.id || 0) - (b.id || 0));

  // Switch to correct tab
  switchTab(state.activeTab);
}

function restoreTimers() {
  if (state.workoutTimerStart) {
    startWorkoutTimer();
  }
  if (state.restTimer && state.restTimer.remaining > 0) {
    const elapsed = state.restTimer.pausedAt
      ? Math.floor((Date.now() - state.restTimer.pausedAt) / 1000)
      : 0;
    state.restTimer.remaining = Math.max(0, state.restTimer.remaining - elapsed);
    if (state.restTimer.remaining > 0) {
      showRestTimer(state.restTimer.remaining, state.restTimer.total);
    } else {
      hideRestTimer();
    }
  }
}

function bindEvents() {

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));

  document.getElementById('btn-close-picker').addEventListener('click', hideWorkoutPicker);

  document.getElementById('btn-prev-exercise').addEventListener('click', () => navigateExercise(-1));
  document.getElementById('btn-next-exercise').addEventListener('click', () => navigateExercise(1));
  document.getElementById('btn-add-set').addEventListener('click', addSet);
  document.getElementById('btn-finish-workout').addEventListener('click', finishWorkout);
  document.getElementById('btn-dismiss-complete').addEventListener('click', dismissComplete);

  // Rest timer
  document.getElementById('btn-rest-skip').addEventListener('click', hideRestTimer);
  document.getElementById('btn-rest-minus').addEventListener('click', () => adjustRest(-15));
  document.getElementById('btn-rest-plus').addEventListener('click', () => adjustRest(15));

  // Coach
  document.getElementById('btn-send').addEventListener('click', sendChatMessage);
  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();

  document.getElementById('chat-input').addEventListener('input', (e) => {

  });

  // Progress tabs
  document.querySelectorAll('.ptab').forEach((t) => {
    t.addEventListener('click', () => switchProgressTab(t.dataset.ptab));

// ── Tab Navigation ──────────────────────────────

function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.tab').forEach((t) => {
    t.classList.toggle('active', t.dataset.tab === tabId);
  });
  document.querySelectorAll('.view').forEach((v) => {
    v.classList.toggle('hidden', v.id !== `view-${tabId}`);
    v.classList.toggle('active', v.id === `view-${tabId}`);
  });

  if (tabId === 'workout') renderWorkoutView();
  if (tabId === 'coach') renderCoachView();
  if (tabId === 'progress') renderProgressView();

  saveState();
}

// ── Start Workout ───────────────────────────────

async function startWorkout(template) {
  // Get previous session data for pre-filling
  const prevData = await getPreviousSessionData(template.id);

  const exercises = template.exercises.map((ex) => {
    const prev = prevData[ex.id] || [];
    const sets = [];
    for (let i = 0; i < ex.sets; i++) {
      const prevSet = prev[i];
      sets.push({
        weight: prevSet ? prevSet.weight : '',
        reps: prevSet ? prevSet.reps : ex.reps,
        done: false,
        prevWeight: prevSet ? prevSet.weight : null,
        prevReps: prevSet ? prevSet.reps : null
      });
    }
    return { ...ex, sets };
  });

  state.activeWorkout = {
    workoutId: template.id,
    name: template.name,
    startTime: Date.now(),
    exerciseIndex: 0,
    exercises
  };
  state.workoutTimerStart = Date.now();

  saveState();
  startWorkoutTimer();
  renderWorkoutView();
}

async function getPreviousSessionData(workoutId) {
  const sessions = await IronDB.getAll('sessions');
  // Find most recent session for this workout
  const relevant = sessions
    .filter((s) => s.workoutId === workoutId)
    .sort((a, b) => b.date - a.date);

  if (relevant.length === 0) return {};

  const prev = relevant[0];
  const result = {};
  for (const ex of prev.exercises) {
    result[ex.id] = ex.sets.filter((s) => s.done).map((s) => ({
      weight: s.weight,
      reps: s.reps
    }));
  }
  return result;
}

// ── Render Active Workout ───────────────────────

function renderActiveWorkout() {
  const w = state.activeWorkout;
  if (!w) return;

  const ex = w.exercises[w.exerciseIndex];

  document.getElementById('workout-name').textContent = w.name;
  document.getElementById('exercise-name').textContent = ex.name;
  document.getElementById('exercise-target').textContent = ex.target;
  document.getElementById('exercise-counter').textContent = `${w.exerciseIndex + 1} / ${w.exercises.length}`;

  // Progress bar
  const completedExercises = w.exercises.filter((e) => e.sets.every((s) => s.done)).length;
  const pct = (completedExercises / w.exercises.length) * 100;
  document.getElementById('exercise-progress-fill').style.width = pct + '%';

  // Illustration
  const illust = document.getElementById('exercise-illustration');
  illust.innerHTML = ILLUSTRATIONS[ex.id] || ILLUSTRATIONS['default'];

  // Sets
  renderSets(ex);

  // Nav button states
  document.getElementById('btn-prev-exercise').style.opacity = w.exerciseIndex > 0 ? '1' : '0.3';
  document.getElementById('btn-next-exercise').style.opacity = w.exerciseIndex < w.exercises.length - 1 ? '1' : '0.3';
}

function renderSets(ex) {
  const container = document.getElementById('sets-list');
  container.innerHTML = '';

  ex.sets.forEach((set, i) => {
    const row = document.createElement('div');
    row.className = `set-row${set.done ? ' completed' : ''}`;

    // Previous comparison
    let prevText = '-';
    if (set.prevWeight !== null && set.prevReps !== null) {
      prevText = `${set.prevWeight}×${set.prevReps}`;
    }

    // Comparison indicators
    let weightClass = '';
    let repsClass = '';
    if (set.done && set.prevWeight !== null) {
      const w = parseFloat(set.weight) || 0;
      const pw = parseFloat(set.prevWeight) || 0;
      if (w > pw) weightClass = 'changed-up';
      else if (w < pw) weightClass = 'changed-down';
    }
    if (set.done && set.prevReps !== null) {
      const r = parseInt(set.reps) || 0;
      const pr = parseInt(set.prevReps) || 0;
      if (r > pr) repsClass = 'changed-up';
      else if (r < pr) repsClass = 'changed-down';
    }

    row.innerHTML = `
      <span class="col-set">${i + 1}</span>
      <span class="col-prev">${prevText}</span>
      <input type="number" inputmode="decimal" class="set-input ${weightClass}" value="${set.weight}" data-set="${i}" data-field="weight" placeholder="0" ${set.done ? 'readonly' : ''}>
      <input type="number" inputmode="numeric" class="set-input ${repsClass}" value="${set.reps}" data-set="${i}" data-field="reps" placeholder="0" ${set.done ? 'readonly' : ''}>
      <button class="btn-check ${set.done ? 'checked' : ''}" data-set="${i}">✓</button>
    `;

    container.appendChild(row);
  });

  // Bind input events
  container.querySelectorAll('.set-input').forEach((input) => {
    input.addEventListener('change', handleSetInput);
    input.addEventListener('blur', handleSetInput);
  });

  container.querySelectorAll('.btn-check').forEach((btn) => {
    btn.addEventListener('click', handleSetDone);
  });
}

function handleSetInput(e) {
  const idx = parseInt(e.target.dataset.set);
  const field = e.target.dataset.field;
  const ex = state.activeWorkout.exercises[state.activeWorkout.exerciseIndex];
  ex.sets[idx][field] = e.target.value;

  // Highlight comparison
  const set = ex.sets[idx];
  if (field === 'weight' && set.prevWeight !== null) {
    const cur = parseFloat(e.target.value) || 0;
    const prev = parseFloat(set.prevWeight) || 0;
    e.target.classList.remove('changed-up', 'changed-down');
    if (cur > prev) e.target.classList.add('changed-up');
    else if (cur < prev) e.target.classList.add('changed-down');
  }
  if (field === 'reps' && set.prevReps !== null) {
    const cur = parseInt(e.target.value) || 0;
    const prev = parseInt(set.prevReps) || 0;
    e.target.classList.remove('changed-up', 'changed-down');
    if (cur > prev) e.target.classList.add('changed-up');
    else if (cur < prev) e.target.classList.add('changed-down');
  }

  saveState();
}

function handleSetDone(e) {
  const idx = parseInt(e.target.dataset.set);
  const ex = state.activeWorkout.exercises[state.activeWorkout.exerciseIndex];
  const set = ex.sets[idx];

  if (set.done) {
    // Undo
    set.done = false;
    saveState();
    renderSets(ex);
    return;
  }

  // Validate - must have weight and reps
  if (!set.weight && set.weight !== 0) {
    toast('Enter weight first');
    return;
  }
  if (!set.reps && set.reps !== 0) {
    toast('Enter reps first');
    return;
  }

  set.done = true;
  saveState();
  renderSets(ex);

  // Haptic feedback
  if (navigator.vibrate) navigator.vibrate(30);

  // Show rest timer if not the last set of the last exercise
  const allDone = ex.sets.every((s) => s.done);
  const isLastExercise = state.activeWorkout.exerciseIndex === state.activeWorkout.exercises.length - 1;

  if (!allDone || !isLastExercise) {
    showRestTimer(ex.restSeconds || 90);
  }

  // Auto-advance to next exercise if all sets done
  if (allDone && !isLastExercise) {
    setTimeout(() => {
      navigateExercise(1);
    }, 500);
  }

  // Update progress bar
  const w = state.activeWorkout;
  const completedExercises = w.exercises.filter((e) => e.sets.every((s) => s.done)).length;
  const pct = (completedExercises / w.exercises.length) * 100;
  document.getElementById('exercise-progress-fill').style.width = pct + '%';
}

function addSet() {
  const ex = state.activeWorkout.exercises[state.activeWorkout.exerciseIndex];
  ex.sets.push({ weight: '', reps: ex.reps, done: false, prevWeight: null, prevReps: null });
  saveState();
  renderSets(ex);
}

function navigateExercise(dir) {
  const w = state.activeWorkout;
  const next = w.exerciseIndex + dir;
  if (next < 0 || next >= w.exercises.length) return;
  w.exerciseIndex = next;
  saveState();
  renderActiveWorkout();
  // Scroll to top
  document.getElementById('exercise-carousel').scrollTop = 0;
}

// ── Workout Timer ───────────────────────────────

function startWorkoutTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.workoutTimerStart) return;
    const elapsed = Math.floor((Date.now() - state.workoutTimerStart) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('workout-timer').textContent =
      `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }, 1000);
}

// ── Rest Timer ──────────────────────────────────

function showRestTimer(seconds, total) {
  total = total || seconds;
  state.restTimer = { remaining: seconds, total };

  const overlay = document.getElementById('rest-timer-overlay');
  overlay.classList.remove('hidden');
  updateRestDisplay();

  if (restInterval) clearInterval(restInterval);
  restInterval = setInterval(() => {
    if (!state.restTimer) return;
    state.restTimer.remaining--;
    if (state.restTimer.remaining <= 0) {
      hideRestTimer();
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      return;
    }
    updateRestDisplay();
  }, 1000);
}

function hideRestTimer() {
  if (restInterval) clearInterval(restInterval);
  state.restTimer = null;
  document.getElementById('rest-timer-overlay').classList.add('hidden');
  saveState();
}

function adjustRest(delta) {
  if (!state.restTimer) return;
  state.restTimer.remaining = Math.max(0, state.restTimer.remaining + delta);
  state.restTimer.total = Math.max(state.restTimer.total, state.restTimer.remaining);
  updateRestDisplay();
}

function updateRestDisplay() {
  if (!state.restTimer) return;
  const r = state.restTimer.remaining;
  const m = Math.floor(r / 60);
  const s = r % 60;
  document.getElementById('rest-time').textContent = `${m}:${String(s).padStart(2, '0')}`;
}

// ── Finish Workout ──────────────────────────────

async function finishWorkout() {
  const w = state.activeWorkout;
  if (!w) return;

  const elapsed = Math.floor((Date.now() - w.startTime) / 1000);

  // Calculate summary stats
  let totalSets = 0, totalReps = 0, totalVolume = 0;
  for (const ex of w.exercises) {
    for (const set of ex.sets) {
      if (set.done) {
        totalSets++;
        const r = parseInt(set.reps) || 0;
        const wt = parseFloat(set.weight) || 0;
        totalReps += r;
        totalVolume += r * wt;
      }
    }
  }

  // Save session to history
  const session = {
    id: `session-${Date.now()}`,
    workoutId: w.workoutId,
    name: w.name,
    date: Date.now(),
    duration: elapsed,
    exercises: w.exercises.map((ex) => ({
      id: ex.id,
      name: ex.name,
      target: ex.target,
      sets: ex.sets.map((s) => ({ weight: s.weight, reps: s.reps, done: s.done }))
    })),
    totalSets,
    totalReps,
    totalVolume
  };

  await IronDB.put('sessions', session);

  // Show summary
  const minutes = Math.floor(elapsed / 60);
  document.getElementById('workout-summary').innerHTML = `
    <div class="summary-stat"><span class="label">Duration</span><span class="value">${minutes} min</span></div>
    <div class="summary-stat"><span class="label">Sets completed</span><span class="value">${totalSets}</span></div>
    <div class="summary-stat"><span class="label">Total reps</span><span class="value">${totalReps}</span></div>
    <div class="summary-stat"><span class="label">Total volume</span><span class="value">${Math.round(totalVolume).toLocaleString()} kg</span></div>
  `;

  document.getElementById('workout-complete').classList.remove('hidden');

  // Clear active workout state
  state.activeWorkout = null;
  state.workoutTimerStart = null;
  if (timerInterval) clearInterval(timerInterval);
  hideRestTimer();
  saveState();
}

function dismissComplete() {
  document.getElementById('workout-complete').classList.add('hidden');
  renderWorkoutView();
}

      <h2>Connect AI Coach</h2>
      <p>Enter your Anthropic API key to enable the AI coaching assistant. Your key is stored locally on this device only.</p>
      <input type="password" id="api-key-input" placeholder="sk-ant-...">
      <button class="btn-primary" id="btn-save-key">Save Key</button>
      <button class="btn-secondary" id="btn-skip-key">Skip for now</button>
    </div>`;
  view.appendChild(prompt);

  document.getElementById('btn-save-key').addEventListener('click', () => {
    const key = document.getElementById('api-key-input').value.trim();
    if (key) {
      state.apiKey = key;
      IronDB.mirrorSet('apiKey', key);
      prompt.remove();
      renderChatMessages();
    }
  });

  document.getElementById('btn-skip-key').addEventListener('click', () => {
    prompt.remove();
    // Show a message that coach needs API key
    const msgDiv = document.getElementById('chat-messages');
    msgDiv.innerHTML += `<div class="message assistant"><div class="message-bubble">To use the AI coach, you'll need an Anthropic API key. You can add one anytime in settings.</div></div>`;
  });
}

function renderChatMessages() {
  const container = document.getElementById('chat-messages');
  // Keep the initial assistant message, add stored messages
  if (state.chatMessages.length > 0) {
    let html = '';
    for (const msg of state.chatMessages) {
      html += `<div class="message ${msg.role}"><div class="message-bubble">${escapeHtml(msg.content)}</div></div>`;
    }
    container.innerHTML = html;
  }
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  // Add user message
  const userMsg = { role: 'user', content: text, ts: Date.now() };
  state.chatMessages.push(userMsg);
  await IronDB.put('chat', { ...userMsg, id: Date.now() });

  input.value = '';
  input.style.height = 'auto';

  // Render user message
  const container = document.getElementById('chat-messages');
  container.innerHTML += `<div class="message user"><div class="message-bubble">${escapeHtml(text)}</div></div>`;

  // Show typing indicator
  container.innerHTML += `<div class="message assistant" id="typing"><div class="message-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`;
  container.scrollTop = container.scrollHeight;

  if (!state.apiKey) {
    document.getElementById('typing')?.remove();
    const errMsg = { role: 'assistant', content: 'Please add your Anthropic API key first to use the AI coach.', ts: Date.now() };
    state.chatMessages.push(errMsg);
    container.innerHTML += `<div class="message assistant"><div class="message-bubble">${escapeHtml(errMsg.content)}</div></div>`;
    container.scrollTop = container.scrollHeight;
    return;
  }

  try {
    // Build messages for API
    const systemPrompt = `You are Iron Coach, a knowledgeable and motivating fitness coach. The user trains 3 days per week (Tuesday, Wednesday, Friday) with a focus on hypertrophy, prioritizing biceps and forearms. Keep responses concise and practical. You can suggest exercises, adjust workout plans, explain proper form, and answer training/nutrition questions. Be encouraging but direct.`;

    const apiMessages = state.chatMessages
      .filter((m) => m.role === 'user' || m.role === 'assistant')
      .slice(-20)
      .map((m) => ({ role: m.role, content: m.content }));

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        system: systemPrompt,
        messages: apiMessages
      })
    });

    document.getElementById('typing')?.remove();

    if (!response.ok) {
      throw new Error(`API error: ${response.status}`);
    }

    const data = await response.json();
    const reply = data.content[0].text;

    const assistantMsg = { role: 'assistant', content: reply, ts: Date.now() };
    state.chatMessages.push(assistantMsg);
    await IronDB.put('chat', { ...assistantMsg, id: Date.now() });

    container.innerHTML += `<div class="message assistant"><div class="message-bubble">${escapeHtml(reply)}</div></div>`;
    container.scrollTop = container.scrollHeight;

  } catch (err) {
    document.getElementById('typing')?.remove();
    const errMsg = { role: 'assistant', content: `Error: ${err.message}. Check your API key and try again.`, ts: Date.now() };
    container.innerHTML += `<div class="message assistant"><div class="message-bubble">${escapeHtml(errMsg.content)}</div></div>`;
    container.scrollTop = container.scrollHeight;
  }
}

// ── Progress View ───────────────────────────────

async function renderProgressView() {
  await populateExerciseSelect();
  renderChart();
  renderPhotoTimeline();
  renderWorkoutHistory();
}

function switchProgressTab(tabId) {
  document.querySelectorAll('.ptab').forEach((t) => {
    t.classList.toggle('active', t.dataset.ptab === tabId);
  });
  document.querySelectorAll('.ptab-content').forEach((c) => {
    c.classList.toggle('hidden', c.id !== `ptab-${tabId}`);
  });
}

async function populateExerciseSelect() {
  const sessions = await IronDB.getAll('sessions');
  const exerciseMap = {};

  for (const s of sessions) {
    for (const ex of s.exercises) {
      if (!exerciseMap[ex.id]) exerciseMap[ex.id] = ex.name;
    }
  }

  const select = document.getElementById('exercise-select');
  select.innerHTML = '<option value="">Select exercise...</option>';
  for (const [id, name] of Object.entries(exerciseMap)) {
    select.innerHTML += `<option value="${id}">${name}</option>`;
  }

  select.addEventListener('change', () => renderChart(select.value));
}

async function renderChart(exerciseId) {
  const canvas = document.getElementById('progress-chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const cw = w / 2, ch = h / 2;

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#161616';
  ctx.beginPath();
  // roundRect polyfill for older iOS Safari
  if (ctx.roundRect) {
    ctx.roundRect(0, 0, cw, ch, 14);
  } else {
    const r = 14;
    ctx.moveTo(r, 0);
    ctx.lineTo(cw - r, 0);
    ctx.arcTo(cw, 0, cw, r, r);
    ctx.lineTo(cw, ch - r);
    ctx.arcTo(cw, ch, cw - r, ch, r);
    ctx.lineTo(r, ch);
    ctx.arcTo(0, ch, 0, ch - r, r);
    ctx.lineTo(0, r);
    ctx.arcTo(0, 0, r, 0, r);
    ctx.closePath();
  }
  ctx.fill();

  if (!exerciseId) {
    ctx.fillStyle = '#555';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Select an exercise to see progress', cw / 2, ch / 2);
    return;
  }

  const sessions = await IronDB.getAll('sessions');
  const dataPoints = [];

  for (const s of sessions.sort((a, b) => a.date - b.date)) {
    for (const ex of s.exercises) {
      if (ex.id === exerciseId) {
        let maxWeight = 0, totalReps = 0;
        for (const set of ex.sets) {
          if (set.done) {
            const wt = parseFloat(set.weight) || 0;
            if (wt > maxWeight) maxWeight = wt;
            totalReps += parseInt(set.reps) || 0;
          }
        }
        if (maxWeight > 0) {
          dataPoints.push({ date: s.date, weight: maxWeight, reps: totalReps });
        }
      }
    }
  }

  if (dataPoints.length < 2) {
    ctx.fillStyle = '#555';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Need at least 2 sessions to chart', cw / 2, ch / 2);
    return;
  }

  // Draw chart
  const pad = { top: 20, right: 16, bottom: 30, left: 40 };
  const chartW = cw - pad.left - pad.right;
  const chartH = ch - pad.top - pad.bottom;

  const maxW = Math.max(...dataPoints.map((d) => d.weight));
  const minW = Math.min(...dataPoints.map((d) => d.weight));
  const range = maxW - minW || 1;

  // Grid lines
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(cw - pad.right, y);
    ctx.stroke();

    const val = maxW - (range / 4) * i;
    ctx.fillStyle = '#666';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(1), pad.left - 6, y + 3);
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';

  dataPoints.forEach((d, i) => {
    const x = pad.left + (i / (dataPoints.length - 1)) * chartW;
    const y = pad.top + (1 - (d.weight - minW) / range) * chartH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Dots
  dataPoints.forEach((d, i) => {
    const x = pad.left + (i / (dataPoints.length - 1)) * chartW;
    const y = pad.top + (1 - (d.weight - minW) / range) * chartH;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f97316';
    ctx.fill();
  });

  // Date labels
  ctx.fillStyle = '#666';
  ctx.font = '9px system-ui';
  ctx.textAlign = 'center';
  const labelCount = Math.min(dataPoints.length, 5);
  for (let i = 0; i < labelCount; i++) {
    const idx = Math.round((i / (labelCount - 1)) * (dataPoints.length - 1));
    const x = pad.left + (idx / (dataPoints.length - 1)) * chartW;
    const d = new Date(dataPoints[idx].date);
    ctx.fillText(`${d.getMonth() + 1}/${d.getDate()}`, x, ch - 8);
  }

  // Legend
  document.getElementById('chart-legend').innerHTML =
    `<span style="color:#f97316">● Max weight (kg)</span>`;
}

// ── Photo Timeline ──────────────────────────────

async function renderPhotoTimeline() {
  const photos = await IronDB.getAll('photos');
  const container = document.getElementById('photo-timeline');

  if (photos.length === 0) {
    container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px">No progress photos yet. Add your first one!</p>';
    return;
  }

  photos.sort((a, b) => b.date - a.date);
  container.innerHTML = photos.map((p) => {
    const d = new Date(p.date);
    return `<div class="photo-entry">
      <img src="${p.data}" alt="Progress photo">
      <div class="photo-date">${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
    </div>`;
  }).join('');
}

async function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  // Read as data URL
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const photo = {
      id: `photo-${Date.now()}`,
      date: Date.now(),
      data: ev.target.result
    };
    await IronDB.put('photos', photo);
    renderPhotoTimeline();
    toast('Photo saved!');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ── Workout History ─────────────────────────────

async function renderWorkoutHistory() {
  const sessions = await IronDB.getAll('sessions');
  const container = document.getElementById('workout-history');

  if (sessions.length === 0) {
    container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px">No workout history yet. Complete your first workout!</p>';
    return;
  }

  sessions.sort((a, b) => b.date - a.date);
  container.innerHTML = sessions.slice(0, 20).map((s) => {
    const d = new Date(s.date);
    const mins = Math.floor(s.duration / 60);
    return `<div class="history-item">
      <h4>${s.name}</h4>
      <div class="history-date">${d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${mins} min</div>
      ${s.exercises.map((ex) => {
        const doneSets = ex.sets.filter((st) => st.done);
        const best = doneSets.reduce((max, st) => Math.max(max, parseFloat(st.weight) || 0), 0);
        return `<div class="history-exercise">
          <span class="name">${ex.name}</span>
          <span class="detail">${doneSets.length} sets · ${best}kg</span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

// ── Utilities ───────────────────────────────────

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function renderCurrentView() {
  switchTab(state.activeTab);
}

// ── Bootstrap ───────────────────────────────────

init();

  </script>
